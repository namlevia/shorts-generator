name: Render Shorts Video

on:
  workflow_dispatch:
    inputs:
      script_json:
        description: 'Pre-generated script.json content'
        required: false
        default: ''
      caption:
        description: 'Pre-generated TikTok caption'
        required: false
        default: ''
      url:
        description: 'GitHub repository or Article URL (used if script_json is empty)'
        required: false
        default: 'https://github.com/namlevia/AI-auto-generate-video'
      theme:
        description: 'Visual Theme (dark-neon / light-pro)'
        required: false
        default: 'dark-neon'
        type: choice
        options:
          - dark-neon
          - light-pro
      voice:
        description: 'Edge-TTS Voice ID'
        required: false
        default: 'vi-VN-NamMinhNeural'
  repository_dispatch:
    types: [generate-video]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-inter fonts-noto-cjk

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Video
        env:
          SCRIPT_JSON: ${{ inputs.script_json }}
          CAPTION_TEXT: ${{ inputs.caption }}
          TTS_PROVIDER: 'edge-tts'
          EDGE_TTS_VOICE: ${{ inputs.voice || 'vi-VN-NamMinhNeural' }}
          VIDEO_THEME: ${{ inputs.theme || 'dark-neon' }}
          CHANNEL_NAME: 'LeviaTech'
          TIKTOK_HANDLE: '@leviatech'
          TIKTOK_DISPLAY_NAME: 'LeviaTech'
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY }}
          LLM_MODEL: 'gemini-2.0-flash'
        run: |
          if [ -n "$SCRIPT_JSON" ]; then
            echo "🎬 Nhận kịch bản từ local! Render video bằng cli.ts (không cần LLM)..."
            mkdir -p output/cloud-render
            node -e 'const fs = require("fs"); fs.writeFileSync("output/cloud-render/script.json", process.env.SCRIPT_JSON, "utf8");'
            node -e 'const fs = require("fs"); fs.writeFileSync("output/cloud-render/caption.txt", process.env.CAPTION_TEXT || "", "utf8");'
            npx tsx src/cli.ts output/cloud-render/script.json
          else
            TARGET_URL="${{ inputs.url || github.event.client_payload.url }}"
            echo "🚀 Không có script_json, chạy quy trình đầy đủ với make.ts: $TARGET_URL"
            npx tsx src/make.ts "$TARGET_URL"
          fi

          # Tối ưu hóa dung lượng video cho TikTok & download nhanh về Pi (150MB -> ~15-20MB)
          FINAL_VIDEO=$(find output -name "video.mp4" | head -n 1)
          if [ -f "$FINAL_VIDEO" ]; then
            echo "⚡ Đang nén tối ưu video (CRF 26, faststart)..."
            ffmpeg -y -i "$FINAL_VIDEO" -vcodec libx264 -crf 26 -preset fast -pix_fmt yuv420p -movflags +faststart "$FINAL_VIDEO.opt.mp4"
            mv "$FINAL_VIDEO.opt.mp4" "$FINAL_VIDEO"
            echo "Dung lượng video sau tối ưu:"
            ls -lh "$FINAL_VIDEO"
          fi

      - name: Upload Output Video Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-shorts-video
          path: |
            output/**/video.mp4
            output/**/caption.txt
            output/**/script.json
          retention-days: 7

      - name: Send Video to Telegram (Optional)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VIDEO_FILE=$(find output -name "video.mp4" | head -n 1)
          CAPTION_FILE=$(find output -name "caption.txt" | head -n 1)
          CAPTION=$(cat "$CAPTION_FILE" 2>/dev/null || echo "Video hoàn thành!")
          if [ -f "$VIDEO_FILE" ]; then
            echo "Sending $VIDEO_FILE to Telegram chat $TELEGRAM_CHAT_ID..."
            curl -F chat_id="$TELEGRAM_CHAT_ID" -F caption="$CAPTION" -F video=@"$VIDEO_FILE" \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo"
          fi
